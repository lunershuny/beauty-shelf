<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的美妝櫃</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="美妝櫃">
<meta name="theme-color" content="#F2EBE3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2EBE3; --surface:#FBF8F4; --ink:#4B3B31; --muted:#9A8677; --line:#E7DCD0;
  --berry:#9C7258; --berry-soft:#EFE3D7; --ok:#7A8A66; --ok-soft:#E7EADC;
  --warn:#B98446; --warn-soft:#F5E7D3; --bad:#B0655A; --bad-soft:#F3E0DA;
  --display:"LXGW WenKai TC","PingFang TC","Noto Sans TC",serif;
  --body:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#29211C; --surface:#342A24; --ink:#F1E7DC; --muted:#B8A696; --line:#4A3D34;
    --berry:#D8B08F; --berry-soft:#4A3A2E; --ok:#B4C198; --ok-soft:#34382A;
    --warn:#E2B379; --warn-soft:#45351F; --bad:#E29A8C; --bad-soft:#4A2E29; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#29211C; --surface:#342A24; --ink:#F1E7DC; --muted:#B8A696; --line:#4A3D34;
  --berry:#D8B08F; --berry-soft:#4A3A2E; --ok:#B4C198; --ok-soft:#34382A;
  --warn:#E2B379; --warn-soft:#45351F; --bad:#E29A8C; --bad-soft:#4A2E29; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
img{max-width:100%}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 18px 8px}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;letter-spacing:.02em}
.sync{font-size:13px;color:var(--muted);margin:2px 0 10px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 0;font-size:15px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding:8px 18px 120px}
.toolbar{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.toolbar input{flex:1 1 160px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px}
.chips{display:flex;gap:6px;overflow-x:auto}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--berry-soft);border-color:var(--berry);color:var(--berry)}

.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;margin-bottom:10px}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--berry-soft);flex:none;display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--berry)}
.item .meta{min-width:0;flex:1}
.brand{font-size:13px;color:var(--muted)}
.pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.berry{background:var(--berry-soft);color:var(--berry)}

/* PAO jar: the signature element */
.jar{flex:none;width:46px;text-align:center;font-size:11px;color:var(--muted)}
.jar svg{display:block;margin:0 auto 2px}

.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty p{margin:6px 0}
h2{font-family:var(--display);font-size:21px;margin:22px 0 8px;font-weight:700}
.big{font-family:var(--display);font-size:34px;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat small{color:var(--muted);font-size:13px}
.bar{display:grid;grid-template-columns:72px 1fr 76px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.bar i{display:block;height:10px;border-radius:5px;background:var(--berry);min-width:2px}
.bar span:last-child{text-align:right;color:var(--muted)}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--berry);color:#fff;border:none;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:600;box-shadow:0 6px 18px rgba(110,80,55,.22);z-index:6}

dialog{border:none;border-radius:20px;padding:0;width:min(560px,94vw);max-height:90vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(60,42,32,.35)}
.dlg{padding:18px 18px 20px;overflow-y:auto;max-height:90vh}
.dlg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dlg-head h3{font-family:var(--display);font-size:22px;margin:0}
.x{border:none;background:none;font-size:26px;line-height:1;color:var(--muted);padding:4px 8px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
.f{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px}
.btn.primary{background:var(--berry);color:#fff;border-color:var(--berry);font-size:16px;padding:11px 18px;width:100%;margin-top:16px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.preview{margin-top:8px;max-height:160px;border-radius:12px;display:none}
.scan{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--berry);background:var(--berry-soft);color:var(--berry);border-radius:16px;padding:14px;margin:4px 0 2px;font-weight:600;cursor:pointer}
.scan.busy{opacity:.6;pointer-events:none}
.scan[hidden]{display:none}
.f.filled{border-color:var(--berry);background:var(--berry-soft)}

.hero{display:flex;gap:14px;align-items:center}
.hero img,.hero .thumb{width:96px;height:96px;border-radius:16px;object-fit:cover}
.unit{border-top:1px solid var(--line);padding:10px 0}
.unit .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.unit .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.unit img{width:56px;height:56px;border-radius:8px;object-fit:cover;margin-top:6px}
.seg{display:flex;gap:6px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>我的美妝櫃</h1>
    <div class="sync" id="sync">資料只存在這支手機，記得定期到「統計」備份</div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="shelf">櫃子</button>
      <button role="tab" aria-selected="false" data-tab="alerts">提醒</button>
      <button role="tab" aria-selected="false" data-tab="stats">統計</button>
    </div>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
<button class="fab" id="fab">＋ 記一筆購買</button>
<div class="toast" id="toast"></div>

<dialog id="formDlg"><form class="dlg" id="form" method="dialog">
  <div class="dlg-head"><h3 id="formTitle">記一筆購買</h3><button type="button" class="x" data-close aria-label="關閉">×</button></div>
  <div class="row">
    <div><label for="fBrand">品牌</label><input class="f" id="fBrand" list="brandList" required autocomplete="off"></div>
    <div><label for="fName">品名</label><input class="f" id="fName" list="nameList" required autocomplete="off"></div>
  </div>
  <div class="hint" id="matchHint"></div>
  <div class="row">
    <div><label for="fCat">分類</label><select class="f" id="fCat"><option>保養</option><option>彩妝</option><option>身體</option><option>髮品</option><option>香水</option><option>其他</option></select></div>
    <div><label for="fPao">開封後可用</label><select class="f" id="fPao"><option value="">不確定</option><option value="3">3 個月</option><option value="6">6 個月</option><option value="12" selected>12 個月</option><option value="18">18 個月</option><option value="24">24 個月</option><option value="36">36 個月</option></select></div>
  </div>
  <div class="row">
    <div><label for="fDate">購買日期</label><input class="f" type="date" id="fDate" required></div>
    <div><label for="fExp">有效期限</label><input class="f" type="date" id="fExp"></div>
  </div>
  <div class="row">
    <div><label for="fPrice">總金額</label><input class="f" type="number" id="fPrice" min="0" inputmode="decimal" placeholder="NT$"></div>
    <div><label for="fQty">數量</label><input class="f" type="number" id="fQty" min="1" max="20" value="1"></div>
  </div>
  <label for="fChannel">購買通路</label><input class="f" id="fChannel" list="channelList" placeholder="例如：屈臣氏、官網、百貨">
  <label for="fPhoto">照片（商品或收據）</label><input class="f" type="file" id="fPhoto" accept="image/*">
  <img class="preview" id="fPreview" alt="">
  <label for="fNote">備註</label><textarea class="f" id="fNote" rows="2" placeholder="色號、容量、心得"></textarea>
  <button class="btn primary" type="submit" id="fSubmit">儲存</button>
</form></dialog>

<dialog id="detailDlg"><div class="dlg" id="detail"></div></dialog>
<datalist id="brandList"></datalist><datalist id="nameList"></datalist><datalist id="channelList"></datalist>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const days=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const addMonths=(s,m)=>{const d=parse(s);d.setMonth(d.getMonth()+Number(m));return ymd(d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+Math.round(n));return ymd(d)};
const money=n=>"NT$"+Math.round(n||0).toLocaleString("zh-TW");
const md=s=>{const d=parse(s);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)}

/* ---------- storage: IndexedDB on this device ---------- */
const S={items:new Map()};
const DBN="beauty-shelf",STORE="products",BKEY="beauty-shelf-lastBackup";
let idb=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(mode,fn){return new Promise((res,rej)=>{const t=idb.transaction(STORE,mode);const out=fn(t.objectStore(STORE));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function initDB(){
  try{
    idb=await openDB();
    const all=await tx("readonly",st=>st.getAll());
    (all||[]).forEach(p=>S.items.set(p.id,p));
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){$("#sync").textContent="這個瀏覽器無法儲存資料，請用 Safari 或 Chrome，並關閉無痕模式"}
  render();
}
async function putProduct(p){
  p.updatedAt=Date.now();S.items.set(p.id,p);render();
  if(!idb)return;
  try{await tx("readwrite",st=>st.put(p))}catch(e){toast("儲存失敗，手機空間可能不足")}
}
async function dropProduct(id){
  S.items.delete(id);render();
  if(!idb)return;
  try{await tx("readwrite",st=>st.delete(id))}catch(e){toast("刪除失敗，請再試一次")}
}
function compress(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image();img.onload=()=>{
      const r=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(img.src);res(c);
    };img.onerror=rej;img.src=URL.createObjectURL(file);
  });
}
async function storePhoto(file){
  if(!file)return null;
  const c=await compress(file,900,.78);
  return {data:c.toDataURL("image/jpeg",.78)};
}
const photoSrc=ph=>ph&&ph.data?ph.data:"";

/* ---------- backup ---------- */
function backupBlock(){
  let last=null;try{last=localStorage.getItem(BKEY)}catch(e){}
  return `<h2>備份</h2><p class="hint">資料只存在這支手機的瀏覽器裡，換手機或清除瀏覽器資料就會不見。建議每個月匯出一次，換手機時到新手機匯入。${last?`上次備份：${md(last)}`:"還沒備份過"}</p>
  <div style="display:flex;gap:8px"><button class="btn" id="expBtn" style="flex:1">匯出備份</button><label class="btn" style="flex:1;text-align:center;margin:0;color:var(--ink)">匯入備份<input type="file" accept=".json,application/json" id="impFile" hidden></label></div>`;
}
function exportBackup(){
  const data={app:"beauty-shelf",version:1,exportedAt:new Date().toISOString(),products:[...S.items.values()]};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`美妝櫃備份-${today()}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  try{localStorage.setItem(BKEY,today())}catch(e){}
  toast("備份檔已下載");render();
}
async function importBackup(file){
  let list;
  try{const data=JSON.parse(await file.text());list=Array.isArray(data)?data:data.products;if(!Array.isArray(list))throw 0}
  catch(e){toast("這不是美妝櫃的備份檔");return}
  const ok=list.filter(p=>p&&p.id&&p.brand&&p.name);
  if(!ok.length){toast("備份檔裡沒有商品");return}
  if(!confirm(`要匯入 ${ok.length} 個商品嗎？相同的商品會以備份檔為準。`))return;
  for(const p of ok){p.units=Array.isArray(p.units)?p.units:[];await putProduct(p)}
  toast(`已匯入 ${ok.length} 個商品`);
}

/* ---------- domain logic ---------- */
function deadline(p,u){
  if(u.status==="done"||u.status==="tossed")return null;
  const c=[];if(u.expiry)c.push(u.expiry);
  if(u.openedAt&&p.pao)c.push(addMonths(u.openedAt,p.pao));
  return c.length?c.sort()[0]:null;
}
function tone(dl){if(!dl)return "";const d=days(today(),dl);return d<0?"bad":d<=30?"warn":"ok"}
function dlText(dl){if(!dl)return "";const d=days(today(),dl);return d<0?`過期 ${-d} 天`:d===0?"今天到期":`剩 ${d} 天`}
function analyze(p){
  const units=p.units||[];
  const batches=[...new Map(units.map(u=>[u.batch,u])).values()].map(u=>({date:u.date,total:units.filter(x=>x.batch===u.batch).reduce((s,x)=>s+(x.price||0),0)})).sort((a,b)=>a.date<b.date?-1:1);
  const spent=units.reduce((s,u)=>s+(u.price||0),0);
  const gaps=batches.slice(1).map((b,i)=>days(batches[i].date,b.date));
  const avgGap=gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:null;
  const used=units.filter(u=>u.status==="done"&&u.openedAt&&u.finishedAt).map(u=>({d:Math.max(1,days(u.openedAt,u.finishedAt)),price:u.price||0}));
  const avgUse=used.length?used.reduce((a,b)=>a+b.d,0)/used.length:null;
  const perDay=used.length?used.reduce((a,b)=>a+b.price/b.d,0)/used.length:null;
  const stock=units.filter(u=>u.status==="stock").length, open=units.filter(u=>u.status==="open");
  let next=null;
  if(!stock&&open.length&&avgUse)next=addDays(open[0].openedAt,avgUse);
  else if(!stock&&avgGap&&batches.length)next=addDays(batches.at(-1).date,avgGap);
  const dls=units.map(u=>deadline(p,u)).filter(Boolean).sort();
  return {units,batches,times:batches.length,spent,avgGap,avgUse,perDay,stock,open:open.length,next,nearest:dls[0]||null,last:batches.at(-1)?.date};
}
const products=()=>[...S.items.values()].sort((a,b)=>(analyze(b).last||"")>(analyze(a).last||"")?1:-1);

/* ---------- views ---------- */
let tab="shelf",filter="all",q="";
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x===b));render();scrollTo(0,0)});

function jar(p){
  if(!p.pao)return "";
  return `<div class="jar" title="開封後 ${p.pao} 個月"><svg width="30" height="28" viewBox="0 0 30 28" aria-hidden="true"><rect x="4" y="9" width="22" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 9 L9 2 H24" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="15" y="21" text-anchor="middle" font-size="9" fill="currentColor" font-family="sans-serif">${p.pao}M</text></svg></div>`;
}
function thumb(p,cls="thumb"){
  const src=photoSrc(p.photo);
  return src?`<img class="${cls}" src="${esc(src)}" alt="" loading="lazy">`:`<div class="${cls}">${esc((p.brand||"?").slice(0,1))}</div>`;
}
function card(p){
  const a=analyze(p);const tags=[];
  tags.push(`<span class="tag berry">買過 ${a.times} 次</span>`);
  if(a.open)tags.push(`<span class="tag">使用中 ${a.open}</span>`);
  if(a.stock)tags.push(`<span class="tag">囤貨 ${a.stock}</span>`);
  if(!a.open&&!a.stock)tags.push(`<span class="tag">已用完</span>`);
  if(a.nearest)tags.push(`<span class="tag ${tone(a.nearest)}">${dlText(a.nearest)}</span>`);
  if(p.verdict==="no")tags.push(`<span class="tag bad">不回購</span>`);
  return `<button class="item" data-open="${esc(p.id)}">${thumb(p)}<div class="meta"><div class="brand">${esc(p.brand)}・${esc(p.cat)}</div><div class="pname">${esc(p.name)}</div><div class="tags">${tags.join("")}</div></div>${jar(p)}</button>`;
}
function viewShelf(){
  let list=products();
  if(q){const k=q.toLowerCase();list=list.filter(p=>(p.brand+p.name+p.cat).toLowerCase().includes(k))}
  if(filter!=="all")list=list.filter(p=>{const a=analyze(p);return filter==="open"?a.open:filter==="stock"?a.stock:!a.open&&!a.stock});
  const chip=(v,t)=>`<button class="chip" data-f="${v}" aria-pressed="${filter===v}">${t}</button>`;
  return `<div class="toolbar"><input type="search" id="q" placeholder="搜尋品牌或品名" value="${esc(q)}"><div class="chips">${chip("all","全部")}${chip("open","使用中")}${chip("stock","囤貨")}${chip("done","用完")}</div></div>`+
  (S.items.size===0?`<div class="empty"><p class="big">櫃子還是空的</p><p>按下方「記一筆購買」，拍下第一瓶吧</p></div>`:
   list.length?list.map(card).join(""):`<div class="empty"><p>沒有符合的商品</p></div>`);
}
function viewAlerts(){
  const rows=[];const restock=[];
  products().forEach(p=>{const a=analyze(p);
    a.units.forEach(u=>{const dl=deadline(p,u);if(dl&&days(today(),dl)<=60)rows.push({p,u,dl})});
    if(a.next&&days(today(),a.next)<=21)restock.push({p,a});
  });
  rows.sort((x,y)=>x.dl<y.dl?-1:1);
  const line=(p,right,cls,sub)=>`<button class="item" data-open="${esc(p.id)}">${thumb(p)}<div class="meta"><div class="brand">${esc(p.brand)}</div><div class="pname">${esc(p.name)}</div><div class="tags"><span class="tag ${cls}">${right}</span><span class="tag">${sub}</span></div></div></button>`;
  const exp=rows.filter(r=>days(today(),r.dl)<0), soon=rows.filter(r=>days(today(),r.dl)>=0);
  let h="";
  if(exp.length)h+=`<h2>已經過期</h2>`+exp.map(r=>line(r.p,dlText(r.dl),"bad",r.u.status==="open"?"開封中":"未開封")).join("");
  if(soon.length)h+=`<h2>60 天內到期</h2>`+soon.map(r=>line(r.p,dlText(r.dl),tone(r.dl),r.u.status==="open"?"開封中":"未開封")).join("");
  if(restock.length)h+=`<h2>差不多該補貨</h2>`+restock.map(({p,a})=>line(p,days(today(),a.next)<0?"可能已經用完":`約 ${days(today(),a.next)} 天後用完`,"berry",`平均 ${Math.round(a.avgUse||a.avgGap)} 天一瓶`)).join("");
  return h||`<div class="empty"><p class="big">目前沒有要注意的</p><p>開封時記得在商品裡按「開封了」，才算得出開封後期限</p></div>`;
}
function viewStats(){
  const all=products();if(!all.length)return `<div class="empty"><p class="big">還沒有資料</p><p>記幾筆購買後，這裡會出現花費和回購分析</p></div>`+backupBlock();
  const units=all.flatMap(p=>(p.units||[]).map(u=>({...u,cat:p.cat})));
  const y=String(new Date().getFullYear()), m=today().slice(0,7);
  const sum=f=>units.filter(f).reduce((s,u)=>s+(u.price||0),0);
  const months=[];for(let i=11;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const k=ymd(d).slice(0,7);months.push([k,sum(u=>u.date.startsWith(k))])}
  const mmax=Math.max(1,...months.map(x=>x[1]));
  const cats={};units.filter(u=>u.date.startsWith(y)).forEach(u=>cats[u.cat]=(cats[u.cat]||0)+(u.price||0));
  const cmax=Math.max(1,...Object.values(cats));
  const top=all.map(p=>({p,a:analyze(p)})).filter(x=>x.a.times>1).sort((a,b)=>b.a.times-a.a.times).slice(0,5);
  const best=all.map(p=>({p,a:analyze(p)})).filter(x=>x.a.perDay).sort((a,b)=>a.a.perDay-b.a.perDay).slice(0,5);
  return `<div class="stats" style="margin-top:8px">
    <div class="stat"><small>今年花費</small><div class="big">${money(sum(u=>u.date.startsWith(y)))}</div></div>
    <div class="stat"><small>本月花費</small><div class="big">${money(sum(u=>u.date.startsWith(m)))}</div></div>
    <div class="stat"><small>使用中／囤貨</small><div class="big">${units.filter(u=>u.status==="open").length}／${units.filter(u=>u.status==="stock").length}</div></div>
  </div>
  <h2>近 12 個月花費</h2>${months.map(([k,v])=>`<div class="bar"><span>${Number(k.slice(5))} 月</span><i style="width:${v/mmax*100}%"></i><span>${money(v)}</span></div>`).join("")}
  ${Object.keys(cats).length?`<h2>今年各分類</h2>`+Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="bar"><span>${esc(c)}</span><i style="width:${v/cmax*100}%"></i><span>${money(v)}</span></div>`).join(""):""}
  ${top.length?`<h2>最常回購</h2>`+top.map(({p,a})=>`<button class="item" data-open="${esc(p.id)}">${thumb(p)}<div class="meta"><div class="brand">${esc(p.brand)}</div><div class="pname">${esc(p.name)}</div><div class="tags"><span class="tag berry">買過 ${a.times} 次</span>${a.avgGap?`<span class="tag">平均隔 ${Math.round(a.avgGap)} 天回購</span>`:""}</div></div></button>`).join(""):""}
  ${best.length?`<h2>每天最划算</h2>`+best.map(({p,a})=>`<button class="item" data-open="${esc(p.id)}">${thumb(p)}<div class="meta"><div class="brand">${esc(p.brand)}</div><div class="pname">${esc(p.name)}</div><div class="tags"><span class="tag ok">每天 ${money(a.perDay)}</span><span class="tag">一瓶用 ${Math.round(a.avgUse)} 天</span></div></div></button>`).join(""):`<p class="hint">商品用完時按「用完了」，就會算出每天花多少錢。</p>`}`+backupBlock();
}
function render(){
  $("#view").innerHTML=tab==="shelf"?viewShelf():tab==="alerts"?viewAlerts():viewStats();
  const qi=$("#q");if(qi){qi.oninput=e=>{q=e.target.value;const pos=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
  const eb=$("#expBtn");if(eb)eb.onclick=exportBackup;
  const ib=$("#impFile");if(ib)ib.onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importBackup(f)};
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  const ps=products();
  $("#brandList").innerHTML=[...new Set(ps.map(p=>p.brand))].map(v=>`<option value="${esc(v)}">`).join("");
  $("#nameList").innerHTML=[...new Set(ps.map(p=>p.name))].map(v=>`<option value="${esc(v)}">`).join("");
  $("#channelList").innerHTML=[...new Set(ps.flatMap(p=>(p.units||[]).map(u=>u.channel)).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join("");
  if(openId&&$("#detailDlg").open)drawDetail();
}

/* ---------- add purchase ---------- */
let lockId=null;
const findMatch=()=>{const b=$("#fBrand").value.trim(),n=$("#fName").value.trim();return [...S.items.values()].find(p=>p.brand===b&&p.name===n)};
function updateHint(){const m=findMatch();$("#matchHint").textContent=m?`會加到現有的「${m.name}」，這是第 ${analyze(m).times+1} 次購買`:"";if(m){$("#fCat").value=m.cat;$("#fPao").value=m.pao||""}}
$("#fBrand").oninput=updateHint;$("#fName").oninput=updateHint;
$("#fPhoto").onchange=e=>{const f=e.target.files[0];const pv=$("#fPreview");if(f){pv.src=URL.createObjectURL(f);pv.style.display="block"}else pv.style.display="none"};
function openForm(p){
  $("#form").reset();$("#fDate").value=today();$("#fQty").value=1;$("#fPreview").style.display="none";
  lockId=p?p.id:null;
  $("#fBrand").value=p?p.brand:"";$("#fName").value=p?p.name:"";
  $("#fBrand").readOnly=$("#fName").readOnly=!!p;
  $("#formTitle").textContent=p?"再買一次":"記一筆購買";
  updateHint();$("#formDlg").showModal();
}
$("#fab").onclick=()=>openForm(null);
$("#form").onsubmit=async e=>{
  e.preventDefault();const btn=$("#fSubmit");btn.disabled=true;btn.textContent="儲存中…";
  try{
    const file=$("#fPhoto").files[0];const photo=await storePhoto(file);
    let p=lockId?structuredClone(S.items.get(lockId)):findMatch();
    p=p?structuredClone(p):{id:uid(),brand:$("#fBrand").value.trim(),name:$("#fName").value.trim(),units:[],createdAt:Date.now()};
    p.cat=$("#fCat").value;p.pao=$("#fPao").value||null;
    if(photo&&!p.photo)p.photo=photo;
    const qty=Math.max(1,Math.min(20,Number($("#fQty").value)||1));const total=Number($("#fPrice").value)||0;const batch=uid();
    for(let i=0;i<qty;i++)p.units.push({id:uid(),batch,date:$("#fDate").value,price:Math.round(total/qty*100)/100,expiry:$("#fExp").value||null,channel:$("#fChannel").value.trim(),note:$("#fNote").value.trim(),photo:i===0?photo:null,status:"stock",openedAt:null,finishedAt:null});
    await putProduct(p);$("#formDlg").close();toast(analyze(p).times>1?`已記錄，這是第 ${analyze(p).times} 次買`:"已記錄");
  }catch(err){toast("照片讀取失敗，換一張試試")}
  btn.disabled=false;btn.textContent="儲存";
};

/* ---------- detail ---------- */
let openId=null;
function openDetail(id){openId=id;drawDetail();if(!$("#detailDlg").open)$("#detailDlg").showModal()}
function drawDetail(){
  const p=S.items.get(openId);if(!p){$("#detailDlg").close();return}
  const a=analyze(p);
  const st={stock:"未開封",open:"使用中",done:"用完",tossed:"丟掉"};
  const units=[...a.units].sort((x,y)=>x.date<y.date?1:-1);
  const facts=[`買過 ${a.times} 次`,`共 ${money(a.spent)}`];
  if(a.avgGap)facts.push(`平均隔 ${Math.round(a.avgGap)} 天回購`);
  if(a.avgUse)facts.push(`一瓶約用 ${Math.round(a.avgUse)} 天`);
  if(a.perDay)facts.push(`每天 ${money(a.perDay)}`);
  if(a.next)facts.push(`預估 ${md(a.next)} 需要補貨`);
  $("#detail").innerHTML=`<div class="dlg-head"><span class="brand">${esc(p.brand)}・${esc(p.cat)}</span><button class="x" data-close aria-label="關閉">×</button></div>
  <div class="hero">${thumb(p)}<div><h3 style="font-family:var(--display);font-size:22px;margin:0">${esc(p.name)}</h3><div class="tags" style="margin-top:6px">${facts.map(f=>`<span class="tag">${f}</span>`).join("")}</div></div></div>
  <label>會再買嗎</label><div class="seg">${[["yes","會回購"],["no","不回購"],["","還沒決定"]].map(([v,t])=>`<button class="chip" data-verdict="${v}" aria-pressed="${(p.verdict||"")===v}">${t}</button>`).join("")}</div>
  <h2 style="font-size:18px">購買紀錄</h2>
  ${units.map(u=>{const dl=deadline(p,u);return `<div class="unit"><div class="top"><strong>${md(u.date)}</strong><span>${money(u.price)}${u.channel?"・"+esc(u.channel):""}</span></div>
    <div class="tags"><span class="tag">${st[u.status]}</span>${u.openedAt?`<span class="tag">${md(u.openedAt)} 開封</span>`:""}${u.finishedAt?`<span class="tag">${md(u.finishedAt)} ${u.status==="tossed"?"丟掉":"用完"}</span>`:""}${u.expiry?`<span class="tag">期限 ${md(u.expiry)}</span>`:""}${dl?`<span class="tag ${tone(dl)}">${dlText(dl)}</span>`:""}</div>
    ${u.note?`<div class="hint">${esc(u.note)}</div>`:""}${u.photo?`<img src="${esc(photoSrc(u.photo))}" alt="購買照片" loading="lazy">`:""}
    <div class="acts">${u.status==="stock"?`<button class="btn sm" data-act="open" data-u="${u.id}">開封了</button>`:""}${u.status==="open"?`<button class="btn sm" data-act="done" data-u="${u.id}">用完了</button>`:""}${u.status==="stock"||u.status==="open"?`<button class="btn sm" data-act="toss" data-u="${u.id}">丟掉了</button>`:""}${u.status!=="stock"?`<button class="btn sm" data-act="undo" data-u="${u.id}">改回未開封</button>`:""}<button class="btn sm danger" data-act="del" data-u="${u.id}">刪除這筆</button></div></div>`}).join("")}
  <button class="btn primary" id="again">再買一次</button>
  <div style="display:flex;gap:8px;margin-top:10px"><label class="btn" style="margin:0;flex:1;text-align:center">換商品照片<input type="file" accept="image/*" id="newPhoto" hidden></label><button class="btn danger" id="delP" style="flex:1">刪除整個商品</button></div>`;
  $("#detail").querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$("#detailDlg").close());
  $("#detail").querySelectorAll("[data-verdict]").forEach(b=>b.onclick=()=>{const n=structuredClone(p);n.verdict=b.dataset.verdict||null;putProduct(n)});
  $("#detail").querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const n=structuredClone(p);const u=n.units.find(x=>x.id===b.dataset.u);const act=b.dataset.act;
    if(act==="del"){if(!confirm("刪除這筆購買紀錄？"))return;n.units=n.units.filter(x=>x!==u);if(!n.units.length){dropProduct(n.id);$("#detailDlg").close();return}}
    if(act==="open"){u.status="open";u.openedAt=today()}
    if(act==="done"){u.status="done";u.finishedAt=today();if(!u.openedAt)u.openedAt=u.date}
    if(act==="toss"){u.status="tossed";u.finishedAt=today()}
    if(act==="undo"){u.status="stock";u.openedAt=null;u.finishedAt=null}
    putProduct(n);toast({open:"已記下開封日",done:"已記下用完",toss:"已記下丟掉",undo:"已改回未開封",del:"已刪除"}[act]);
  });
  $("#again").onclick=()=>{$("#detailDlg").close();openForm(p)};
  $("#newPhoto").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const ph=await storePhoto(f);const n=structuredClone(p);n.photo=ph;putProduct(n);toast("照片已更新")}catch(err){toast("照片讀取失敗")}};
  $("#delP").onclick=()=>{if(confirm(`刪除「${p.name}」和全部 ${a.units.length} 筆紀錄？`)){dropProduct(p.id);$("#detailDlg").close()}};
}
$("#detailDlg").addEventListener("close",()=>openId=null);
document.querySelectorAll("#formDlg [data-close]").forEach(b=>b.onclick=()=>$("#formDlg").close());

initDB();
</script>
</body>
</html>
